name: Daily Japanese Proverb Push

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # ✅ 解决 Node.js 20 弃用警告

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2  # ✅ 升级到支持 Node.js 24 的版本

      - name: Set up Python
        uses: actions/setup-python@v5.6.0  # ✅ 升级到支持 Node.js 24 的版本
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python send.py
